name: Build Flet APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Install Flet CLI
      run: |
        pip install --upgrade pip
        pip install flet==0.25.2

    - name: Build APK
      run: |
        cd Android
        flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: Android/build/app/outputs/flutter-apk/app-release.apk
