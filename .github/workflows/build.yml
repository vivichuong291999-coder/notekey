name: Build Flet APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Hạ từ 3.13 xuống 3.12 để đảm bảo tương thích tốt nhất với Flet 0.25.2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5' # Thay thế bản 3.47.7 (không tồn tại) bằng một phiên bản stable hợp lệ
        channel: 'stable'

    - name: Install Flet CLI
      run: |
        pip install --upgrade pip
        pip install flet==0.25.2

    - name: Build APK
      run: |
        flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: build/apk/*.apk # Sử dụng dấu * để tự động lấy bất kỳ file .apk nào được tạo ra, tránh lỗi sai tên
