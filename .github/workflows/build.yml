name: Build Flet APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Configure Flutter & Accept Licenses
      run: |
        # Tắt các nền tảng không cần thiết để tránh lỗi thiếu thư viện trên Ubuntu
        flutter config --no-enable-linux-desktop
        flutter config --no-enable-web
        flutter config --no-enable-windows-desktop
        flutter config --no-enable-macos-desktop
        
        # Tự động đồng ý toàn bộ giấy phép Android SDK
        yes | flutter doctor --android-licenses
        
        # Chạy kiểm tra lại để đảm bảo không còn lỗi đỏ (X)
        flutter doctor -v

    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet==0.25.2

    - name: Build APK
      run: |
        flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: build/apk/*.apk
